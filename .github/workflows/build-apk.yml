name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GroundTrace-build-diagnostics
          path: build.log
          if-no-files-found: ignore
      - name: Report build failure for remote diagnosis
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -f build.log ]; then
            tail -c 18000 build.log > excerpt.log
          else
            echo "Build failed before the Gradle build step; inspect workflow action setup." > excerpt.log
          fi
          {
            echo "### Android build error"
            echo "Commit: ${{ github.sha }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '~~~'
            cat excerpt.log
            echo '~~~'
          } > issue.md
          gh issue create --title "GroundTrace build failure — ${{ github.run_id }}" --body-file issue.md || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GroundTrace-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
